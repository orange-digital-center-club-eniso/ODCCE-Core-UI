<!-- Section Life Inside ODCCE -->
<section id="community" class="relative bg-[#0a0a0a] py-24 overflow-hidden" style="background-image:
    radial-gradient(circle at 50% 30%, rgba(255,121,0,0.15) 0%, transparent 50%),
    radial-gradient(rgba(255,255,255,0.05) 1px, transparent 1px);
    background-size: 100% 100%, 22px 22px;">
  <div class="max-w-7xl mx-auto px-6 lg:px-8">

    <!-- En-tête de section -->
    <div class="text-center mb-16">
      <span class="inline-block px-4 py-1.5 mb-4 text-xs font-semibold tracking-widest text-[#FF7900] uppercase border border-[#FF7900]/30 rounded-full bg-[#FF7900]/10">
        COMMUNITY & LIFE
      </span>
      <h2 class="text-3xl md:text-4xl lg:text-5xl font-bold tracking-tight mb-4 text-white">
        Life Inside ODCCE
      </h2>
      <p class="text-gray-400 text-sm md:text-base max-w-xl mx-auto">
        Beyond technical projects: team outings, bonding retreats, tech summits, and community celebrations.
      </p>
    </div>

    <!-- Grille des photos (Style Bento / Asymétrique) -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">

      <!-- Photo 1 (Grande - Amphithéâtre) -->
      <div class="md:col-span-2 relative h-72 md:h-80 rounded-3xl overflow-hidden border border-gray-800 bg-black group shadow-2xl">
        <img src="community/img8.png" alt="Team Group Photo" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
        <div class="absolute inset-0 bg-gradient-to-t from-black/50 via-transparent to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
      </div>

      <!-- Photo 2 (Certificats / Équipe) -->
      <div class="relative h-72 md:h-80 rounded-3xl overflow-hidden border border-gray-800 bg-black group shadow-2xl">
        <img src="community/img7.JPG" alt="Team Certificates" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
        <div class="absolute inset-0 bg-gradient-to-t from-black/50 via-transparent to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
      </div>

      <!-- Photo 3 (Stand / Événement) -->
      <div class="relative h-72 md:h-80 rounded-3xl overflow-hidden border border-gray-800 bg-black group shadow-2xl">
        <img src="community/img3.jpg" alt="ODCCE Stand" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
        <div class="absolute inset-0 bg-gradient-to-t from-black/50 via-transparent to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
      </div>

      <!-- Photo 4 (Atelier / Salle) -->
      <div class="relative h-72 md:h-80 rounded-3xl overflow-hidden border border-gray-800 bg-black group shadow-2xl">
        <img src="community/img4.jpg" alt="Workshop Session" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
        <div class="absolute inset-0 bg-gradient-to-t from-black/50 via-transparent to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
      </div>

      <!-- Photo 5 (Exposition / Stand Projets) -->
      <div class="relative h-72 md:h-80 rounded-3xl overflow-hidden border border-gray-800 bg-black group shadow-2xl">
        <img src="community/img5.jpg" alt="Project Exhibition" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
        <div class="absolute inset-0 bg-gradient-to-t from-black/50 via-transparent to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
      </div>

    </div>

  </div>
</section>
