<button (click)="prevSlide()"
        class="absolute left-6 top-1/2 -translate-y-1/2 z-10 w-11 h-11 rounded-full bg-white/10 backdrop-blur border border-white/20 flex items-center justify-center text-white text-xl hover:bg-white/20 transition-colors">
  ‹
</button>
<button (click)="nextSlide()"
        class="absolute right-6 top-1/2 -translate-y-1/2 z-10 w-11 h-11 rounded-full bg-white/10 backdrop-blur border border-white/20 flex items-center justify-center text-white text-xl hover:bg-white/20 transition-colors">
  ›
</button>
<section class="relative min-h-[90vh] flex items-center justify-center overflow-hidden bg-[#0a0a0a]">

  <div class="absolute inset-0 z-0">
    <div *ngFor="let image of slides; let i = index"
         class="absolute inset-0 transition-opacity duration-1000 ease-in-out"
         [class.opacity-100]="currentIndex === i"
         [class.opacity-0]="currentIndex !== i">

      <img [src]="image" alt="Background Slide" class="w-full h-full object-cover" [class.zoom-active]="currentIndex === i">

      <div class="absolute inset-0 bg-black/75 backdrop-blur-[2px]"></div>
    </div>
  </div>

  <div class="relative z-10 max-w-4xl mx-auto px-6 text-center">
    <div class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full border border-orange-500/30 bg-orange-500/10 text-orange-400 text-xs font-semibold tracking-wider uppercase mb-6 shadow-lg shadow-orange-500/10">
      #Deep_Dive_Into_Tech
    </div>

    <h1 class="text-4xl md:text-7xl font-extrabold text-white tracking-tight mb-6">
      Innovate. <span class="text-orange-500">Build.</span> Lead.
    </h1>

    <p class="text-base md:text-lg text-neutral-300 max-w-2xl mx-auto mb-10 leading-relaxed">
      At ODCCE, student passion meets industry standards. Take a #Deep_Dive_Into_Tech with hands-on technical workshops.
    </p>

    <div class="flex flex-col sm:flex-row items-center justify-center gap-4">
      <a href="#divisions" class="w-full sm:w-auto inline-flex items-center justify-center gap-2 rounded-full bg-orange-600 px-8 py-4 text-sm font-semibold text-white shadow-xl shadow-orange-600/20 transition hover:bg-orange-500">
        <span>Explore Divisions</span>
        <span>></span>
      </a>
      <a href="#" class="w-full sm:w-auto inline-flex items-center justify-center gap-2 rounded-full border border-neutral-700 bg-neutral-900/50 backdrop-blur-md px-8 py-4 text-sm font-semibold text-neutral-200 transition hover:bg-neutral-800 hover:text-white">
        <span>Member Portal</span>
      </a>
    </div>
  </div>

  <div class="absolute bottom-6 left-0 right-0 z-10 flex justify-center gap-3">
    <button *ngFor="let slide of slides; let i = index"
            (click)="currentIndex = i"
            class="h-2 rounded-full transition-all duration-300"
            [class.w-8]="currentIndex === i"
            [class.bg-orange-500]="currentIndex === i"
            [class.w-2]="currentIndex !== i"
            [class.bg-neutral-600]="currentIndex !== i">
    </button>
  </div>

</section>
