<section
  id="partners"
  class="relative bg-black py-24 overflow-hidden"
  style="background-image:
    radial-gradient(circle at 50% 40%, rgba(255,121,0,0.12) 0%, transparent 55%),
    radial-gradient(rgba(255,255,255,0.05) 1px, transparent 1px);
    background-size: 100% 100%, 22px 22px;"
>
  <div class="max-w-7xl mx-auto px-6 text-center mb-12">

    <!-- En-tête de section -->
    <div class="inline-flex items-center px-4 py-1.5 rounded-full text-xs font-semibold tracking-wider text-orange-500 bg-orange-500/10 border border-orange-500/20 mb-4 uppercase">
      Our Partners &amp; Sponsors
    </div>

    <h2 class="text-2xl md:text-3xl font-bold text-white mb-3">
      Trusted by Organizations That Believe in Us
    </h2>
    <p class="text-neutral-400 text-sm md:text-base leading-relaxed max-w-2xl mx-auto">
      From industry leaders to academic institutions, our partners help us bridge engineering education with real-world impact.
    </p>

  </div>

  <!-- Carrousel Infini en Mouvement -->
  <div class="relative w-full overflow-hidden">

    <!-- Effets de fondu sur les bords gauche et droit -->
    <div class="absolute left-0 top-0 bottom-0 w-24 bg-gradient-to-r from-black to-transparent z-10 pointer-events-none"></div>
    <div class="absolute right-0 top-0 bottom-0 w-24 bg-gradient-to-l from-black to-transparent z-10 pointer-events-none"></div>

    <div class="animate-marquee flex gap-6 items-center w-max">

      <!-- PREMIÈRE SÉRIE DE LOGOS -->
      <div class="flex gap-6 items-center shrink-0">
        <div
          *ngFor="let partner of partnersList"
          class="group w-40 h-24 rounded-xl bg-white/80 backdrop-blur-sm flex items-center justify-center p-4
             border border-transparent transition-all duration-300
             hover:-translate-y-1 hover:shadow-xl hover:shadow-orange-500/20 hover:border-orange-500/40 hover:bg-white"
        >
          <img
            [src]="partner.logo"
            [alt]="partner.name"
            class="max-h-full max-w-full object-contain transition-transform duration-300 group-hover:scale-105"
          >
        </div>
      </div>

      <!-- DEUXIÈME SÉRIE DUPLIQUÉE (Pour assurer la boucle fluide) -->
      <div class="flex gap-6 items-center shrink-0" aria-hidden="true">
        <div
          *ngFor="let partner of partnersList"
          class="group w-40 h-24 rounded-xl bg-white/80 backdrop-blur-sm flex items-center justify-center p-4
             border border-transparent transition-all duration-300
             hover:-translate-y-1 hover:shadow-xl hover:shadow-orange-500/20 hover:border-orange-500/40 hover:bg-white"
        >
          <img
            [src]="partner.logo"
            [alt]="partner.name"
            class="max-h-full max-w-full object-contain transition-transform duration-300 group-hover:scale-105"
          >
        </div>
      </div>

    </div>
  </div>
</section>
