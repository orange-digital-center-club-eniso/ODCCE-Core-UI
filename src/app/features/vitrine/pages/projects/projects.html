<section
  id="projects"
  class="relative bg-[#0a0a0a] py-24 overflow-hidden"
  style="background-image:
    radial-gradient(circle at 50% 30%, rgba(255,121,0,0.15) 0%, transparent 50%),
    radial-gradient(rgba(255,255,255,0.05) 1px, transparent 1px);
    background-size: 100% 100%, 22px 22px;"
>
  <div class="max-w-7xl mx-auto px-6">

    <!-- En-tête de section -->
    <div class="text-center max-w-3xl mx-auto mb-10">
      <div class="inline-flex items-center px-4 py-1.5 rounded-full text-xs font-semibold tracking-wider text-orange-500 bg-orange-500/10 border border-orange-500/20 mb-3 uppercase">
        Projects
      </div>
      <h2 class="text-3xl md:text-5xl font-extrabold tracking-tight text-white mb-3">
        Engineered by Our Members
      </h2>
      <p class="text-neutral-400 text-sm md:text-base leading-relaxed">
        Real projects solving real problems. From hardware-embedded structures to premium algorithmic cloud frameworks.
      </p>
    </div>

    <!-- Carrousel -->
    <div class="relative">

      <button
        (click)="scrollLeft()"
        aria-label="Previous project"
        class="absolute left-0 top-1/2 -translate-y-1/2 -translate-x-1/2 z-40 w-11 h-11 rounded-full bg-neutral-800/80 backdrop-blur border border-white/10 flex items-center justify-center text-white hover:bg-neutral-700 hover:border-orange-500/40 transition-all"
      >
        ←
      </button>

      <button
        (click)="scrollRight()"
        aria-label="Next project"
        class="absolute right-0 top-1/2 -translate-y-1/2 translate-x-1/2 z-40 w-11 h-11 rounded-full bg-orange-500 flex items-center justify-center text-white hover:bg-orange-600 hover:scale-105 transition-all"
      >
        →
      </button>

      <div class="pointer-events-none absolute inset-y-0 left-0 w-16 md:w-24 bg-gradient-to-r from-[#0a0a0a] to-transparent z-20"></div>
      <div class="pointer-events-none absolute inset-y-0 right-0 w-16 md:w-24 bg-gradient-to-l from-[#0a0a0a] to-transparent z-20"></div>

      <div
        #scrollContainer
        class="flex gap-6 overflow-x-auto snap-x snap-mandatory scroll-smooth no-scrollbar px-12 md:px-16 py-2"
      >
        <div
          *ngFor="let project of projects"
          class="group relative snap-start shrink-0 w-[320px] rounded-2xl overflow-hidden
                 bg-neutral-900/40 backdrop-blur-md border border-white/10
                 transition-all duration-300 hover:scale-105 hover:z-30
                 hover:border-orange-500/30 hover:shadow-2xl hover:shadow-orange-500/10"
        >
          <!-- Halo derrière la carte, révélé au survol -->
          <div class="absolute -inset-8 bg-orange-500/0 group-hover:bg-orange-500/10 blur-2xl transition-all duration-500 -z-10 rounded-full"></div>

          <!-- Fine ligne d'accent en haut, visible au survol -->
          <div class="absolute top-0 left-0 right-0 h-[2px] bg-gradient-to-r from-transparent via-orange-500 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>

          <!-- Image avec fondu vers le fond de la carte -->
          <div class="relative overflow-hidden h-52">
            <img
              [src]="project.image"
              [alt]="project.title"
              [style.object-position]="project.imagePosition || 'center'"
              class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-110"
            >
            <!-- Dégradé qui fond l'image dans le fond de carte, plus de coupure nette -->
            <div class="absolute inset-x-0 bottom-0 h-16 bg-gradient-to-t from-neutral-900/90 to-transparent"></div>
          </div>

          <div class="relative p-6">
            <h3 class="text-lg font-bold text-white mb-2">{{ project.title }}</h3>
            <p class="text-sm text-neutral-400 leading-relaxed mb-5">
              {{ project.description }}
            </p>

            <!-- Tags redessinés en chips, style mono cohérent avec le reste du site -->
            <div class="flex flex-wrap gap-2">
              <span
                *ngFor="let tag of project.tags"
                class="font-mono text-[11px] px-2.5 py-1 rounded-full bg-orange-500/10 border border-orange-500/20 text-orange-400"
              >
                {{ tag }}
              </span>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>
</section>
