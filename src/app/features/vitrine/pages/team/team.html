<section id="team" class="relative bg-[#0a0a0a] py-24 overflow-hidden">
  <div class="max-w-7xl mx-auto px-6 lg:px-8">

    <!-- En-tête de section -->
    <div class="text-center mb-16">
      <span class="inline-block px-4 py-1.5 mb-4 text-xs font-semibold tracking-widest text-[#FF7900] uppercase border border-[#FF7900]/30 rounded-full bg-[#FF7900]/10">
        LEADERSHIP
      </span>
      <h2 class="text-3xl md:text-4xl lg:text-5xl font-bold tracking-tight mb-4 text-white">
        Meet the Executive Board
      </h2>
      <p class="text-gray-400 text-sm md:text-base max-w-xl mx-auto">
        The core student leaders steering ODCCE towards technical excellence and innovation.
      </p>
    </div>

  </div>

  <!-- Marquee : pleine largeur, en dehors du max-w-7xl pour un défilement bord à bord -->
  <div
    #marqueeWrapper
    class="relative w-full overflow-hidden marquee-wrapper"
    (mouseenter)="paused = true"
    (mouseleave)="paused = false"
  >
    <!-- Masques de fondu sur les bords -->
    <div class="pointer-events-none absolute inset-y-0 left-0 w-16 md:w-32 bg-gradient-to-r from-[#0a0a0a] to-transparent z-20"></div>
    <div class="pointer-events-none absolute inset-y-0 right-0 w-16 md:w-32 bg-gradient-to-l from-[#0a0a0a] to-transparent z-20"></div>

    <div class="flex gap-6 w-max marquee-track" [class.start-animation]="isVisible" [class.marquee-paused]="paused">      <!-- Premier passage : la liste réelle -->
      <div
        *ngFor="let member of members"
        class="w-[300px] shrink-0 bg-black border border-gray-800 rounded-3xl overflow-hidden flex flex-col justify-between hover:border-[#FF7900] hover:shadow-[0_0_30px_rgba(255,121,0,0.2)] transition-all duration-500 group"
      >
        <div>
          <div class="relative h-72 w-full bg-gray-950 overflow-hidden">
            <img [src]="member.image" [alt]="member.name" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-700">
            <div class="absolute inset-0 bg-gradient-to-t from-black via-transparent to-transparent opacity-80 group-hover:opacity-50 transition-opacity duration-500"></div>
            <span class="absolute top-4 right-4 bg-black/60 backdrop-blur-md border border-gray-700 text-[#FF7900] text-[10px] font-bold px-2.5 py-1 rounded-full uppercase tracking-wider">
              ODCCE
            </span>
          </div>
          <div class="p-6">
            <h3 class="text-xl font-bold text-white tracking-tight mb-1 truncate group-hover:text-[#FF7900] transition-colors">{{ member.name }}</h3>
            <span class="text-xs font-semibold text-[#FF7900] uppercase tracking-wider block mb-4 line-clamp-1">{{ member.role }}</span>
          </div>
        </div>
        <div class="p-6 pt-0 mt-auto">
          <div class="flex items-center gap-3 pt-3 border-t border-gray-900 text-gray-400">
            <a *ngIf="member.linkedin" [href]="member.linkedin" class="p-2 rounded-xl bg-gray-900/50 hover:bg-[#FF7900] hover:text-black transition-all duration-300">
              <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z"/></svg>
            </a>
            <a *ngIf="member.github" [href]="member.github" class="p-2 rounded-xl bg-gray-900/50 hover:bg-[#FF7900] hover:text-black transition-all duration-300">
              <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/></svg>
            </a>
          </div>
        </div>
      </div>

      <!-- Second passage : copie EXACTE de la liste, immédiatement à la suite -->
      <!-- Indispensable pour la boucle infinie sans "saut" visible -->
      <div
        *ngFor="let member of members"
        aria-hidden="true"
        class="w-[300px] shrink-0 bg-black border border-gray-800 rounded-3xl overflow-hidden flex flex-col justify-between hover:border-[#FF7900] hover:shadow-[0_0_30px_rgba(255,121,0,0.2)] transition-all duration-500 group"
      >
        <div>
          <div class="relative h-72 w-full bg-gray-950 overflow-hidden">
            <img [src]="member.image" [alt]="member.name" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-700">
            <div class="absolute inset-0 bg-gradient-to-t from-black via-transparent to-transparent opacity-80 group-hover:opacity-50 transition-opacity duration-500"></div>
            <span class="absolute top-4 right-4 bg-black/60 backdrop-blur-md border border-gray-700 text-[#FF7900] text-[10px] font-bold px-2.5 py-1 rounded-full uppercase tracking-wider">
              ODCCE
            </span>
          </div>
          <div class="p-6">
            <h3 class="text-xl font-bold text-white tracking-tight mb-1 truncate group-hover:text-[#FF7900] transition-colors">{{ member.name }}</h3>
            <span class="text-xs font-semibold text-[#FF7900] uppercase tracking-wider block mb-4 line-clamp-1">{{ member.role }}</span>
          </div>
        </div>
        <div class="p-6 pt-0 mt-auto">
          <div class="flex items-center gap-3 pt-3 border-t border-gray-900 text-gray-400">
            <a *ngIf="member.linkedin" [href]="member.linkedin" class="p-2 rounded-xl bg-gray-900/50 hover:bg-[#FF7900] hover:text-black transition-all duration-300">
              <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z"/></svg>
            </a>
            <a *ngIf="member.github" [href]="member.github" class="p-2 rounded-xl bg-gray-900/50 hover:bg-[#FF7900] hover:text-black transition-all duration-300">
              <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/></svg>
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>

</section>
